<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Markaz At-Ta'allum LMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* TEMA BIRU GELAP AT-TA'ALLUM */
        :root {
            --bg-main: #0B1120;       /* Biru Sangat Gelap (Background) */
            --card-blue: #1E293B;     /* Biru Navy (Warna Kotak) */
            --accent-blue: #3B82F6;   /* Biru Terang (Tombol/Aksen) */
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-light);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; /* Bikin posisi persis di tengah layar */
            padding: 20px;
        }

        .login-container {
            background-color: var(--card-blue);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-top: 4px solid var(--accent-blue); /* Garis aksen biru di atas */
        }

        .logo-placeholder {
            font-size: 3.5rem;
            color: var(--accent-blue);
            margin-bottom: 15px;
        }

        .login-container h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .login-container p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 40px; }

        /* Tombol Login Google */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: white;
            color: #333;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-google img { width: 24px; margin-right: 10px; }

        .btn-google:hover {
            background-color: #f1f1f1;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,255,255,0.1);
        }

    </style>
</head>
<body>

    <div class="login-container">
        <i class="fa-solid fa-graduation-cap logo-placeholder"></i>
        <h1>Markaz At-Ta'allum</h1>
        <p>Portal LMS Resmi Santri</p>

        <button class="btn-google" id="loginBtn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
            Lanjutkan dengan Google
        </button>
    </div>

    </body>
</html>
