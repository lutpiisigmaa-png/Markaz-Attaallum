<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Markaz At-Ta'allum LMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0B1120;       
            --card-blue: #1E293B;     
            --accent-blue: #3B82F6;   
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-light);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            padding: 20px;
        }

        .login-container {
            background-color: var(--card-blue);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-top: 4px solid var(--accent-blue);
        }

        .logo-placeholder {
            font-size: 3.5rem;
            color: var(--accent-blue);
            margin-bottom: 15px;
        }

        .login-container h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .login-container p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 40px; }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: white;
            color: #333;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-google img { width: 24px; margin-right: 10px; }
        .btn-google:hover {
            background-color: #f1f1f1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <i class="fa-solid fa-graduation-cap logo-placeholder"></i>
        <h1>Markaz At-Ta'allum</h1>
        <p>Portal LMS Resmi Santri</p>

        <button class="btn-google" id="loginBtn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
            Lanjutkan dengan Google
        </button>
    </div>

    <script type="module">
        // Import SDK Firebase Auth versi modular (terbaru & ringan)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ GANTI ISI DI DALAM SINI PAKE CONFIG RAHASIA DARI FIREBASE LU BESOK/SORE INI!
        const firebaseConfig = {
            apiKey: "AIzaSyDEK56Ry_tNLxEfrLpPyy1Fb7zp1kyTYpQ",
            authDomain: "attaallum-lms.firebaseapp.com",
            projectId: "attaallum-lms",
            storageBucket: "attaallum-lms.firebasestorage.app",
            messagingSenderId: "1076428842924",
            appId: "1:1076428842924:web:f9aabc6ac47a02161e3c09"
        };

        // Konek ke Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Targetin tombol login
        const loginBtn = document.getElementById('loginBtn');

        loginBtn.addEventListener('click', () => {
            // Panggil pop-up login Google resmi
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    console.log("Sukses Login bray! Nama:", user.displayName);
                    console.log("Email:", user.email);
                    
                    // Simpan nama & foto profil di memori browser biar bisa dipanggil di Dashboard ntar
                    localStorage.setItem("userName", user.displayName);
                    localStorage.setItem("userEmail", user.email);
                    localStorage.setItem("userPhoto", user.photoURL);

                    alert("Selamat Datang, " + user.displayName + "!");
                    
                    // Lempar santri ke halaman utama setelah sukses login!
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    console.error("Gagal Login, error code:", error.code);
                    alert("Waduh, login gagal bray: " + error.message);
                });
        });
    </script>

</body>
</html>
