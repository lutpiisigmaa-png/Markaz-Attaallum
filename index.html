<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markaz At-Ta'allum</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7fa;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            text-align: center; 
            padding-top: 100px; 
        }

        /* Keyframes untuk Animasi Pop-up */
        @keyframes popIn {
            0% {
                opacity: 0; 
                transform: scale(0.9) translateY(20px); 
            }
            100% {
                opacity: 1; 
                transform: scale(1) translateY(0); 
            }
        }
        
        .hero-section {
            background-color: #ffffff;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 6px solid #0056b3; 

            /* Terapkan animasi popIn saat halaman load */
            animation: popIn 0.6s ease-out; 
        }

        /* CSS untuk mengatur ukuran Logo */
        .logo-img {
            max-width: 150px; 
            height: auto; 
            margin-bottom: 20px; 
        }

        h1 {
            color: #0056b3; 
            font-size: 36px;
            margin-top: 0;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            color: #666666;
            margin-bottom: 30px;
        }

        .btn-admin {
            display: inline-block;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s; 
        }

        .btn-admin:hover {
            background-color: #004494;
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <img src="logo.jpeg" alt="Logo Markaz At-Ta'allum" class="logo-img">
        
        <h1>Selamat Datang di Markaz At-Ta'allum</h1>
        <p>Website Resmi Markaz Attaallum</p>
        
        <a href="#" class="btn-admin">Lanjut yuu</a>
    </div>

</body>
</html>
