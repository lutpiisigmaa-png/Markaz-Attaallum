<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Markaz At-Ta'allum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #0B1528 0%, #050814 100%);
            --card-blue: rgba(14, 22, 41, 0.75);     
            --accent-gold: #F59E0B;   
            --text-light: #F8FAFC;
            --text-muted: #64748B;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; /* FONT BARU DI SINI BRAY */
        }
        
        body { 
            background: var(--bg-gradient); 
            color: var(--text-light);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            padding: 20px;
            overflow: hidden;
        }

        .login-card {
            background: var(--card-blue);
            width: 100%;
            max-width: 420px;
            padding: 50px 35px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); 
        }

        .logo-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon {
            font-size: 4rem;
            color: var(--text-light);
            z-index: 2;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
            animation: float 4s ease-in-out infinite;
        }

        .logo-glow {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, rgba(59, 130, 246, 0) 70%);
            border-radius: 50%;
            z-index: 1;
            filter: blur(5px);
        }

        /* TIPOGRAFI BARU - LEBIH RAPET DAN TEGAS */
        .login-card h1 { 
            font-size: 1.9rem; 
            font-weight: 800; 
            letter-spacing: -1px; /* Bikin font makin nempel premium */
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .login-card h1 span {
            color: #3B82F6; 
        }

        .login-card p.subtitle { 
            color: var(--text-muted); 
            font-size: 0.9rem; 
            line-height: 1.6;
            margin-top: 15px;
            margin-bottom: 40px; 
            font-weight: 500;
        }

        /* TOMBOL "SIGN IN WITH GOOGLE" GLOWING */
        .btn-login-gold {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #D97706 100%);
            color: #050814;
            padding: 16px;
            border: none;
            border-radius: 50px; 
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 0 0px rgba(245, 158, 11, 0);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-login-gold i {
            font-size: 1.1rem;
            margin-right: 10px;
            transition: transform 0.3s ease;
        }

        .btn-login-gold:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #FBBF24 0%, var(--accent-gold) 100%);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45), 0 0 15px rgba(245, 158, 11, 0.3);
        }

        .btn-login-gold:hover i {
            transform: translateX(3px); 
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <div class="logo-glow"></div>
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
        </div>

        <h1>Selamat Datang <span>Sobat</span></h1>
        <h1>Attaallum</h1>
        <p class="subtitle">Wadah pendidikan terpadu untuk mengembangkan ilmu, adab, dan percaya diri.</p>

        <button class="btn-login-gold" id="loginBtn">
            <i class="fa-fab fa-google"></i> Sign In with Google
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Ganti pake config asli lu ntar pas mau di-push bray!
        const firebaseConfig = {
            apiKey: "AIzaSyDEK56Ry_tNLxEfrLpPyy1Fb7zp1kyTYpQ",
            authDomain: "attaallum-lms.firebaseapp.com",
            projectId: "attaallum-lms",
            storageBucket: "attaallum-lms.firebasestorage.app",
            messagingSenderId: "1076428842924",
            appId: "1:1076428842924:web:f9aabc6ac47a02161e3c09"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('loginBtn');

        if(loginBtn) {
            loginBtn.addEventListener('click', () => {
                signInWithPopup(auth, provider)
                    .then((result) => {
                        const user = result.user;
                        localStorage.setItem("userName", user.displayName);
                        localStorage.setItem("userEmail", user.email);
                        localStorage.setItem("userPhoto", user.photoURL);

                        alert("Selamat Datang, " + user.displayName + "!");
                        window.location.href = "dashboard.html";
                    })
                    .catch((error) => {
                        console.error("Gagal Login:", error.code);
                        alert("Waduh, login gagal bray: " + error.message);
                    });
            });
        }
    </script>

</body>
</html>
