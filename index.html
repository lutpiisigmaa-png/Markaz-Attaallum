<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markaz At-Ta'allum</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7fa; /* Background abu-abu terang kebiruan supaya bersih */
            color: #2c3e50;
            margin: 0;
            padding: 0;
            /* Membuat semua teks otomatis di tengah halaman */
            text-align: center; 
            padding-top: 150px; 
        }
        
        .hero-section {
            background-color: #ffffff;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            /* Memberikan border aksen warna biru di bagian atas kotak */
            border-top: 6px solid #0056b3; 
        }

        h1 {
            /* Warna biru utama untuk tulisan Selamat Datang */
            color: #0056b3; 
            font-size: 36px;
            margin-top: 0;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            color: #666666;
            margin-bottom: 30px;
        }

        .btn-admin {
            display: inline-block;
            background-color: #0056b3; /* Tombol warna biru */
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-admin:hover {
            background-color: #004494; /* Warna biru agak gelap saat tombol disentuh mouse */
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <h1>Selamat Datang di Markaz At-Ta'allum</h1>
        <p>Portal Resmi Informasi dan Administrasi Organisasi</p>
        
        <a href="#" class="btn-admin">Eksplorasi Layanan</a>
    </div>

</body>
</html>
